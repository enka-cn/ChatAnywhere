<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatAnyWhere v3 · 华为 Pura X Max 阔折叠完整交互原型</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-stage: #eef1f6;
      --bg-page: #ffffff;
      --bg-surface: #f5f6f8;
      --bg-surface-2: #eceef2;
      --bg-input: #f3f4f7;
      --bg-user-bubble: #111827;
      --text-user-bubble: #ffffff;
      --text-primary: #111318;
      --text-secondary: #5a6270;
      --text-tertiary: #8c94a3;
      --border: #e6e8ee;
      --brand: #2563eb;
      --brand-soft: rgba(37, 99, 235, 0.10);
      --warn: #d97706;
      --danger: #dc2626;
      --bezel: #181a20;
      --bezel-ring: #303440;
    }

    .dark {
      --bg-stage: #07080b;
      --bg-page: #0e1014;
      --bg-surface: #171a21;
      --bg-surface-2: #21252f;
      --bg-input: #191c24;
      --bg-user-bubble: #2563eb;
      --text-user-bubble: #ffffff;
      --text-primary: #f2f4f8;
      --text-secondary: #a1a9b8;
      --text-tertiary: #6d7585;
      --border: #252934;
      --brand: #4f83ff;
      --brand-soft: rgba(79, 131, 255, 0.16);
      --warn: #f59e0b;
      --danger: #ef4444;
      --bezel: #090a0d;
      --bezel-ring: #2a2e39;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'HarmonyOS Sans SC', 'PingFang SC', sans-serif;
      background: var(--bg-stage);
      color: var(--text-primary);
      transition: background 0.25s ease, color 0.25s ease;
    }

    .device-shell {
      background: var(--bezel);
      border: 2px solid var(--bezel-ring);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.22), 0 6px 20px rgba(0, 0, 0, 0.12);
      transition: width 0.36s cubic-bezier(0.22, 1, 0.36, 1), height 0.36s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.32s ease;
      position: relative;
      overflow: hidden;
    }

    .device-screen {
      background: var(--bg-page);
      color: var(--text-primary);
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .posture-folded {
      width: min(392px, calc(100vw - 24px));
      height: min(548px, calc(100vh - 116px));
      border-radius: 34px;
      padding: 9px;
    }
    .posture-folded .device-screen { border-radius: 26px; }

    .posture-unfolded {
      width: min(920px, calc(100vw - 24px));
      height: min(650px, calc(100vh - 116px));
      border-radius: 28px;
      padding: 10px;
    }
    .posture-unfolded .device-screen { border-radius: 20px; }

    .thin-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .thin-scroll::-webkit-scrollbar-track { background: transparent; }
    .thin-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .surface { background: var(--bg-surface); }
    .surface-2 { background: var(--bg-surface-2); }
    .bg-page { background: var(--bg-page); }
    .bg-input { background: var(--bg-input); }
    .text-pri { color: var(--text-primary); }
    .text-sec { color: var(--text-secondary); }
    .text-ter { color: var(--text-tertiary); }
    .b-line { border-color: var(--border); }
    .brand-pill { background: var(--brand-soft); color: var(--brand); }

    .sheet-backdrop {
      background: rgba(10, 12, 18, 0.42);
      backdrop-filter: blur(4px);
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.35; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .streaming-dot { animation: pulseDot 1.1s infinite ease-in-out; }

    .hinge-hint {
      position: absolute;
      top: 0; bottom: 0; left: 50%; width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(148, 163, 184, 0.14) 20%, rgba(148, 163, 184, 0.14) 80%, transparent);
      pointer-events: none; z-index: 5;
    }

    input[type="range"].app-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: var(--bg-surface-2);
      outline: none;
    }
    input[type="range"].app-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--brand);
      border: 2px solid var(--bg-page);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-3 px-3 select-none">

  <!-- 原型控制台（设备外） -->
  <header class="w-full max-w-[960px] flex flex-wrap items-center justify-between gap-2 mb-3">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center text-white font-semibold text-xs" style="background: var(--brand);">C</div>
      <div>
        <div class="text-sm font-semibold text-pri leading-tight">ChatAnyWhere v3 · Pura X Max 交互原型</div>
        <div id="postureMeta" class="text-[11px] text-sec leading-tight">展开态 · 7.7″ 阔内屏（全页面 Master-Detail 双栏）</div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-1.5">
      <div class="inline-flex p-0.5 rounded-xl surface border b-line">
        <button id="btnFolded" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
          <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
          <span>折叠态 5.4″</span>
        </button>
        <button id="btnUnfolded" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
          <i data-lucide="tablet" class="w-3.5 h-3.5"></i>
          <span>展开态 7.7″</span>
        </button>
      </div>

      <button id="btnSimMemory" type="button" class="px-2.5 py-1.5 rounded-xl text-xs font-medium surface border b-line text-sec hover:text-pri flex items-center gap-1.5 transition">
        <i data-lucide="gauge" class="w-3.5 h-3.5"></i>
        <span id="simMemoryLabel">记忆 34%</span>
      </button>

      <button id="btnTheme" type="button" class="p-2 rounded-xl surface border b-line text-sec hover:text-pri transition" title="切换浅色 / 深色">
        <i id="themeIcon" data-lucide="moon" class="w-3.5 h-3.5"></i>
      </button>

      <button id="btnExportSpec" type="button" class="px-3 py-1.5 rounded-xl text-xs font-medium text-white flex items-center gap-1.5 transition shadow-sm" style="background: var(--brand);">
        <i data-lucide="code-2" class="w-3.5 h-3.5"></i>
        <span>ArkUI 适配指令</span>
      </button>
    </div>
  </header>

  <!-- 华为 Pura X Max 设备模拟器 -->
  <main class="flex-1 w-full flex items-center justify-center">
    <div id="deviceShell" class="device-shell posture-unfolded">
      <div id="hingeLine" class="hinge-hint"></div>
      <div class="device-screen">

        <!-- 状态栏 -->
        <div class="h-6 px-4 flex items-center justify-between text-[11px] font-medium text-sec shrink-0">
          <span class="tracking-tight">11:18</span>
          <div class="flex items-center gap-1.5">
            <span id="statusBreakpoint" class="px-1.5 py-0.2 rounded text-[10px] surface-2 text-sec font-mono">lg · 双栏</span>
            <i data-lucide="wifi" class="w-3 h-3"></i>
            <i data-lucide="battery-full" class="w-3.5 h-3.5"></i>
          </div>
        </div>

        <!-- 页面级路由容器：chat / creator / skills / settings 全部为独立全页，复用左右双栏结构 -->
        <div class="flex-1 min-h-0 flex relative overflow-hidden">

          <!-- ==================== PAGE 1: 主对话页 ==================== -->
          <div id="pageChat" class="flex-1 min-h-0 flex w-full">
            <!-- 展开态左侧常驻会话栏 -->
            <aside id="desktopSidebar" class="w-[224px] shrink-0 border-r b-line flex flex-col bg-page">
              <div class="p-2.5 flex items-center gap-1.5">
                <button id="btnNewChatSide" type="button" class="flex-1 h-9 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 text-white transition hover:opacity-95" style="background: var(--brand);">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  <span>新对话</span>
                </button>
                <button id="btnToggleSide" type="button" class="w-9 h-9 rounded-xl surface flex items-center justify-center text-sec hover:text-pri transition" title="收起边栏">
                  <i data-lucide="panel-left-close" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="px-2.5 pb-2">
                <div class="flex items-center gap-1.5 px-2.5 h-8 rounded-lg bg-input text-ter">
                  <i data-lucide="search" class="w-3.5 h-3.5 shrink-0"></i>
                  <input id="sideSearch" type="text" placeholder="搜索对话" class="w-full bg-transparent text-xs text-pri outline-none placeholder:text-[var(--text-tertiary)]" />
                </div>
              </div>

              <div id="sideSessionList" class="flex-1 overflow-y-auto thin-scroll px-2 space-y-0.5"></div>

              <div class="p-2 border-t b-line grid grid-cols-3 gap-1">
                <button data-route="creator" type="button" class="route-btn py-2 rounded-xl flex flex-col items-center gap-1 text-[11px] text-sec hover:text-pri surface transition">
                  <i data-lucide="file-pen-line" class="w-4 h-4"></i>
                  <span>创造室</span>
                </button>
                <button data-route="skills" type="button" class="route-btn py-2 rounded-xl flex flex-col items-center gap-1 text-[11px] text-sec hover:text-pri surface transition">
                  <i data-lucide="blocks" class="w-4 h-4"></i>
                  <span>技能</span>
                </button>
                <button data-route="settings" type="button" class="route-btn py-2 rounded-xl flex flex-col items-center gap-1 text-[11px] text-sec hover:text-pri surface transition">
                  <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                  <span>设置</span>
                </button>
              </div>
            </aside>

            <!-- 主对话画布 -->
            <section class="flex-1 min-w-0 flex flex-col bg-page">
              <div class="h-11 px-3 border-b b-line flex items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-1.5 min-w-0">
                  <button id="btnMenuTop" type="button" class="w-8 h-8 rounded-xl flex items-center justify-center text-sec hover:text-pri surface transition" title="会话列表">
                    <i data-lucide="panel-left" class="w-4 h-4"></i>
                  </button>
                  <button id="btnModelCapsule" type="button" class="h-8 px-2.5 rounded-full surface flex items-center gap-1.5 text-xs font-medium text-pri max-w-[260px] transition hover:opacity-90">
                    <span id="capsuleModel" class="truncate">V4.1 Flash</span>
                    <span class="text-ter">·</span>
                    <span id="capsuleThink" class="text-sec shrink-0 font-mono text-[11px]">High</span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-ter shrink-0"></i>
                  </button>
                </div>

                <div class="flex items-center gap-1.5">
                  <button id="btnSessionPersona" type="button" class="h-7 px-2.5 rounded-full surface text-[11px] font-medium text-sec hover:text-pri flex items-center gap-1 transition" title="切换当前对话角色">
                    <i data-lucide="user-round" class="w-3 h-3"></i>
                    <span id="topPersonaLabel">系统架构师</span>
                  </button>
                  <button id="btnNewChatTop" type="button" class="w-8 h-8 rounded-xl flex items-center justify-center text-sec hover:text-pri surface transition" title="新对话">
                    <i data-lucide="square-pen" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div id="chatScroll" class="flex-1 overflow-y-auto thin-scroll px-4 py-3.5">
                <div id="chatStream" class="w-full max-w-[660px] mx-auto space-y-5 pb-3"></div>
              </div>

              <div class="px-3.5 pb-3 pt-1 shrink-0 bg-page">
                <div class="w-full max-w-[660px] mx-auto">
                  <div id="memoryWrap" class="hidden mb-1.5">
                    <div id="memoryBubble" class="hidden mb-1.5 px-3 py-2 rounded-xl surface border b-line flex items-center justify-between gap-2 text-xs">
                      <span id="memoryBubbleText" class="text-sec">对话记忆 76% · 缓存命中 89%</span>
                      <button id="btnCompactNow" type="button" class="font-medium shrink-0" style="color: var(--brand);">立即整理</button>
                    </div>
                    <button id="btnMemoryBar" type="button" class="w-full flex items-center gap-2 py-0.5 group">
                      <div class="flex-1 h-[3px] rounded-full surface-2 overflow-hidden">
                        <div id="memoryFill" class="h-full rounded-full transition-all duration-300" style="width: 76%; background: var(--warn);"></div>
                      </div>
                      <span id="memoryPct" class="text-[10px] font-mono text-ter group-hover:text-pri">76%</span>
                    </button>
                  </div>

                  <!-- 展开态输入框上方：本对话技能快捷开关（统一品牌蓝） -->
                  <div id="unfoldedSkillBar" class="flex items-center gap-1.5 mb-2 overflow-x-auto thin-scroll"></div>

                  <div id="pendingAttachments" class="hidden flex-wrap gap-1.5 mb-2"></div>

                  <div class="rounded-[22px] bg-input border b-line px-2 py-1.5 flex items-end gap-1.5 focus-within:border-[var(--brand)] transition">
                    <button id="btnAttach" type="button" class="w-8 h-8 rounded-full flex items-center justify-center text-sec hover:text-pri shrink-0 transition" title="添加附件">
                      <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                    <textarea id="chatInput" rows="1" placeholder="发消息…" class="flex-1 bg-transparent resize-none outline-none text-[14px] leading-6 text-pri placeholder:text-[var(--text-tertiary)] max-h-24 py-1 thin-scroll"></textarea>
                    <button id="btnFoldSkillQuick" type="button" class="hidden w-8 h-8 rounded-full items-center justify-center shrink-0 transition" title="本对话技能">
                      <i data-lucide="blocks" class="w-4 h-4"></i>
                    </button>
                    <button id="btnSend" type="button" class="w-8 h-8 rounded-full flex items-center justify-center text-white shrink-0 transition" style="background: var(--brand);" title="发送">
                      <i id="sendIcon" data-lucide="arrow-up" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </div>
            </section>

            <!-- 展开态按需滑出信源栏 -->
            <aside id="onDemandSourcePane" class="hidden w-[280px] shrink-0 border-l b-line bg-page flex flex-col">
              <div class="h-11 px-3 border-b b-line flex items-center justify-between shrink-0">
                <span class="text-xs font-semibold text-pri">本轮信源</span>
                <button id="btnCloseSourcePane" type="button" class="w-7 h-7 rounded-lg surface flex items-center justify-center text-sec hover:text-pri">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
              <div id="sourcePaneBody" class="flex-1 overflow-y-auto thin-scroll p-3"></div>
            </aside>
          </div>

          <!-- ==================== PAGE 2: 技能创造室（Master-Detail 双栏独立页） ==================== -->
          <div id="pageCreator" class="hidden flex-1 min-h-0 flex w-full bg-page">
            <!-- 左栏：技能列表 + 搜索 + 新建（解决大量 Skill 胶囊难操作问题） -->
            <aside id="creatorMaster" class="w-[232px] shrink-0 border-r b-line flex flex-col bg-page">
              <div class="h-11 px-3 border-b b-line flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                  <button data-back-chat="1" type="button" class="back-chat-btn w-7 h-7 rounded-lg surface flex items-center justify-center text-sec hover:text-pri">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  </button>
                  <span class="text-sm font-semibold text-pri">创造室</span>
                </div>
                <button id="btnNewSkillMd" type="button" class="h-7 px-2.5 rounded-lg text-xs font-medium text-white flex items-center gap-1" style="background: var(--brand);">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                  <span>新建</span>
                </button>
              </div>
              <div class="p-2.5">
                <div class="flex items-center gap-1.5 px-2.5 h-8 rounded-lg bg-input text-ter">
                  <i data-lucide="search" class="w-3.5 h-3.5 shrink-0"></i>
                  <input id="creatorSearch" type="text" placeholder="搜索技能" class="w-full bg-transparent text-xs text-pri outline-none placeholder:text-[var(--text-tertiary)]" />
                </div>
              </div>
              <div id="creatorSkillList" class="flex-1 overflow-y-auto thin-scroll px-2 pb-2 space-y-1"></div>
            </aside>

            <!-- 右栏：SKILL.md 编辑器 + 预览 + AI 改写 -->
            <section id="creatorDetail" class="flex-1 min-w-0 flex flex-col bg-page">
              <div class="h-11 px-3 border-b b-line flex items-center justify-between gap-2 shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                  <button id="btnCreatorBackList" type="button" class="hidden w-7 h-7 rounded-lg surface items-center justify-center text-sec hover:text-pri">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  </button>
                  <span id="creatorActiveTitle" class="text-sm font-semibold text-pri truncate">联网清洗</span>
                  <span class="px-1.5 py-0.5 rounded surface-2 text-[10px] font-mono text-sec">SKILL.md</span>
                </div>
                <div class="flex items-center gap-1.5">
                  <div class="inline-flex p-0.5 rounded-lg surface text-[11px] font-medium">
                    <button id="btnMdEdit" type="button" class="px-2 py-1 rounded-md transition">编辑</button>
                    <button id="btnMdPreview" type="button" class="px-2 py-1 rounded-md transition">预览</button>
                  </div>
                  <button id="btnCreatorDryRun" type="button" class="h-7 px-2.5 rounded-lg surface text-xs font-medium text-pri">试跑</button>
                  <button id="btnCreatorSave" type="button" class="h-7 px-3 rounded-lg text-xs font-medium text-white" style="background: var(--brand);">保存</button>
                </div>
              </div>

              <div class="flex-1 min-h-0 flex flex-col p-3 gap-2.5 overflow-hidden">
                <div class="flex-1 min-h-0 rounded-2xl surface border b-line overflow-hidden flex flex-col">
                  <textarea id="skillMdEditor" class="flex-1 w-full p-3.5 bg-transparent resize-none outline-none font-mono text-xs leading-relaxed text-pri thin-scroll"></textarea>
                  <div id="skillMdPreview" class="hidden flex-1 overflow-y-auto thin-scroll p-4 text-xs leading-relaxed text-pri space-y-2"></div>
                  <div id="creatorDryRunBanner" class="hidden px-3.5 py-2 border-t b-line text-[11px] flex items-center justify-between brand-pill">
                    <span id="creatorDryRunText">试跑通过 · 138ms</span>
                    <button id="btnCloseDryRun" type="button" class="opacity-80 hover:opacity-100">关闭</button>
                  </div>
                </div>

                <div class="rounded-2xl bg-input border b-line px-2.5 py-1.5 flex items-center gap-2 shrink-0">
                  <i data-lucide="sparkles" class="w-4 h-4 shrink-0" style="color: var(--brand);"></i>
                  <input id="creatorAiInput" type="text" placeholder="输入修改要求…" class="flex-1 bg-transparent text-xs text-pri outline-none placeholder:text-[var(--text-tertiary)]" />
                  <button id="btnCreatorAiRewrite" type="button" class="px-3 py-1.5 rounded-xl text-xs font-medium text-white shrink-0" style="background: var(--brand);">改写</button>
                </div>
              </div>
            </section>
          </div>

          <!-- ==================== PAGE 3: 我的技能（Master-Detail 双栏独立页） ==================== -->
          <div id="pageSkills" class="hidden flex-1 min-h-0 flex w-full bg-page">
            <aside id="skillsMaster" class="w-[232px] shrink-0 border-r b-line flex flex-col bg-page">
              <div class="h-11 px-3 border-b b-line flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2">
                  <button data-back-chat="1" type="button" class="back-chat-btn w-7 h-7 rounded-lg surface flex items-center justify-center text-sec hover:text-pri">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  </button>
                  <span class="text-sm font-semibold text-pri">技能</span>
                </div>
                <button id="btnSkillImport" type="button" class="h-7 px-2.5 rounded-lg surface text-xs font-medium text-pri">导入</button>
              </div>
              <div id="skillsMasterList" class="flex-1 overflow-y-auto thin-scroll p-2 space-y-1"></div>
            </aside>

            <section id="skillsDetail" class="flex-1 min-w-0 flex flex-col bg-page">
              <div class="h-11 px-3 border-b b-line flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2 min-w-0">
                  <button id="btnSkillsBackList" type="button" class="hidden w-7 h-7 rounded-lg surface items-center justify-center text-sec hover:text-pri">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                  </button>
                  <span id="skillsDetailTitle" class="text-sm font-semibold text-pri truncate">联网清洗</span>
                </div>
                <button id="btnSkillOpenCreator" type="button" class="h-7 px-2.5 rounded-lg brand-pill text-xs font-medium">编辑 SKILL.md</button>
              </div>
              <div id="skillsDetailBody" class="flex-1 overflow-y-auto thin-scroll p-4"></div>
            </section>
          </div>

          <!-- ==================== PAGE 4: 设置中心（Master-Detail 双栏 + Cherry Studio 级角色定制） ==================== -->
          <div id="pageSettings" class="hidden flex-1 min-h-0 flex w-full bg-page">
            <aside id="settingsMaster" class="w-[216px] shrink-0 border-r b-line flex flex-col bg-page">
              <div class="h-11 px-3 border-b b-line flex items-center gap-2 shrink-0">

    function getActiveSession() {
      return state.sessions.find((s) => s.id === state.activeSessionId) || state.sessions[0];
    }

    function getSessionPersona(session) {
      return state.personas.find((p) => p.id === session.personaId) || state.personas[0];
    }

    function isSkillActiveInSession(skill, session) {
      if (!skill.globalEnabled) return false;
      if (Object.prototype.hasOwnProperty.call(session.skillOverrides, skill.id)) {
        return session.skillOverrides[skill.id];
      }
      return getSessionPersona(session).defaultSkills.includes(skill.id);
    }

    function toggleSessionSkill(skillId) {
      const session = getActiveSession();
      const skill = state.skills.find((s) => s.id === skillId);
      if (!skill) return;
      if (!skill.globalEnabled) { showToast(`「${skill.name}」在全局已停用`); return; }
      session.skillOverrides[skillId] = !isSkillActiveInSession(skill, session);
      renderAll();
    }

    function navigateTo(route, subView) {
      state.route = route;
      state.foldedSubView = subView || 'master';
      state.sourcePaneOpen = false;
      $('mobileDrawerBackdrop').classList.add('hidden');
      closeSheet();
      renderAll();

    function formatMd(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-pri">$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded surface-2 text-[12px] font-mono">$1</code>')
        .replace(/\n/g, '<br/>');
    }

    function applyMasterDetailVisibility(masterId, detailId, backBtnId) {
      const isUnfolded = state.posture === 'unfolded';
      const master = $(masterId);
      const detail = $(detailId);
      const backBtn = $(backBtnId);

      if (isUnfolded) {
        master.classList.remove('hidden', 'w-full', 'border-r-0');
        master.classList.add('border-r');
        detail.classList.remove('hidden');
        backBtn.classList.add('hidden');
        backBtn.classList.remove('flex');
      } else {
        const showMaster = state.foldedSubView === 'master';
        master.classList.toggle('hidden', !showMaster);
        master.classList.toggle('w-full', showMaster);
        master.classList.toggle('border-r-0', showMaster);
        detail.classList.toggle('hidden', showMaster);
        backBtn.classList.toggle('hidden', showMaster);
        backBtn.classList.toggle('flex', !showMaster);
      }
    }

    function renderChatChrome() {
      const session = getActiveSession();
      const model = MODEL_CATALOG.find((m) => m.id === state.modelId) || MODEL_CATALOG[0];
      const effort = EFFORT_LEVELS[state.effortIdx];
      const persona = getSessionPersona(session);

      $('capsuleModel').textContent = model.name;
      $('capsuleThink').textContent = effort.short;
      $('topPersonaLabel').textContent = persona.name;

      // 展开态技能快捷开关：统一品牌蓝
      const activeGlobalSkills = state.skills.filter((s) => s.globalEnabled);
      $('unfoldedSkillBar').innerHTML = activeGlobalSkills.map((sk) => {
        const on = isSkillActiveInSession(sk, session);
        return `
          <button data-quick-skill="${sk.id}" type="button" class="quick-skill-chip h-7 px-2.5 rounded-full text-[11px] font-medium flex items-center gap-1 border transition shrink-0 ${

            <span>${sk.name}</span>
          </button>`;
      }).join('');
      $('unfoldedSkillBar').querySelectorAll('.quick-skill-chip').forEach((btn) => {
        btn.addEventListener('click', () => toggleSessionSkill(btn.dataset.quickSkill));
      });

      const activeCount = activeGlobalSkills.filter((sk) => isSkillActiveInSession(sk, session)).length;
      const fs = $('btnFoldSkillQuick');
      fs.style.color = activeCount > 0 ? 'var(--brand)' : 'var(--text-tertiary)';
      fs.style.background = activeCount > 0 ? 'var(--brand-soft)' : 'transparent';

      // 附件芯片
      const attWrap = $('pendingAttachments');
      if (state.pendingFiles.length === 0) {
        attWrap.classList.add('hidden');
        attWrap.classList.remove('flex');
      } else {
        attWrap.classList.remove('hidden');
        attWrap.classList.add('flex');
        attWrap.innerHTML = state.pendingFiles.map((f, idx) => `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl surface border b-line text-[11px] text-pri">
            <i data-lucide="${f.icon}" class="w-3 h-3 text-sec"></i>
            <span class="max-w-[140px] truncate">${f.name}</span>
            <button data-rm-att="${idx}" type="button" class="rm-att text-ter hover:text-pri"><i data-lucide="x" class="w-3 h-3"></i></button>
          </span>`).join('');
        attWrap.querySelectorAll('.rm-att').forEach((b) => {
          b.addEventListener('click', () => { state.pendingFiles.splice(Number(b.dataset.rmAtt), 1); renderAll(); });
        });
      }

      const pct = Math.round(state.memoryRatio * 100);
      $('simMemoryLabel').textContent = `记忆 ${pct}%`;
      const showMem = state.compacting || state.memoryRatio >= 0.6;
      $('memoryWrap').classList.toggle('hidden', !showMem);
      $('memoryFill').style.width = `${pct}%`;
      $('memoryFill').style.background = state.memoryRatio >= 0.85 ? 'var(--danger)' : 'var(--warn)';
      $('memoryPct').textContent = state.compacting ? '整理中' : `${pct}%`;
      $('memoryBubbleText').textContent = state.compacting
        ? '正在生成检查点摘要…'
        : `对话记忆 ${pct}% · 本轮命中 ${Math.round(state.cacheHitRatio * 100)}%`;

      $('btnSend').style.background = state.streaming ? 'var(--danger)' : 'var(--brand)';
      $('sendIcon').setAttribute('data-lucide', state.streaming ? 'square' : 'arrow-up');

    function renderMessages() {
      const session = getActiveSession();
      const container = $('chatStream');

      if (session.messages.length === 0) {
        container.innerHTML = `
          <div class="h-full min-h-[260px] flex flex-col items-center justify-center text-center">
            <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-white font-semibold mb-3 shadow-sm" style="background: var(--brand);">C</div>
            <div class="text-sm font-medium text-sec">开始一段新对话</div>
          </div>`;
        return;
      }

      container.innerHTML = session.messages.map((m) => {
        if (m.role === 'user') {
          const atts = m.attachments && m.attachments.length > 0
            ? `<div class="flex flex-wrap justify-end gap-1 mb-1.5">${m.attachments.map((a) => `
                <span class="px-2 py-0.5 rounded-lg surface border b-line text-[11px] text-sec inline-flex items-center gap-1">
                  <i data-lucide="${a.icon}" class="w-3 h-3"></i>${a.name}
                </span>`).join('')}</div>`
            : '';
          return `
            <div class="flex flex-col items-end">
              ${atts}
              <div class="max-w-[82%] px-3.5 py-2.5 rounded-[20px] rounded-br-md text-[14px] leading-relaxed" style="background: var(--bg-user-bubble); color: var(--text-user-bubble);">
                ${formatMd(m.text)}
              </div>
            </div>`;
        }

        const br = m.branches[m.activeBranch] || m.branches[0];
        const hasSteps = br.steps && br.steps.length > 0;
        const hasSources = br.sources && br.sources.length > 0;
        const branchCount = m.branches.length;

        return `
          <div class="space-y-2.5">
            ${hasSteps ? `
              <div>
                <button data-toggle-think="${m.id}" type="button" class="toggle-think h-7 px-2.5 rounded-full surface text-[11px] font-medium text-sec hover:text-pri inline-flex items-center gap-1.5 transition">
                  <i data-lucide="brain" class="w-3 h-3" style="color: var(--brand);"></i>
                  <span>${br.streaming ? '思考中…' : `思考过程${hasSources ? ` · ${br.sources.length} 篇` : ''}`}</span>
                  <i data-lucide="${br.thinkingOpen ? 'chevron-up' : 'chevron-down'}" class="w-3 h-3 text-ter"></i>
                </button>
                ${br.thinkingOpen ? `
                  <div class="mt-2 pl-3 border-l-2 b-line space-y-1.5 py-0.5">
                    ${br.steps.map((st) => st.kind === 'search'
                      ? `<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md brand-pill text-[11px]">
                           <i data-lucide="search" class="w-3 h-3"></i>
                           <span>检索「${st.query}」· ${st.count} 篇</span>
                         </div>`
                      : `<div class="text-xs leading-relaxed text-sec">${st.text}</div>`).join('')}
                  </div>` : ''}
              </div>` : ''}

            <div class="text-[14.5px] leading-[1.72] text-pri">
              ${formatMd(br.text)}${br.streaming ? '<span class="inline-block w-1.5 h-4 ml-1 align-middle rounded-sm streaming-dot" style="background: var(--brand);"></span>' : ''}
            </div>

            ${!br.streaming ? `
              <div class="flex flex-wrap items-center justify-between gap-2 pt-0.5">
                <div class="flex items-center gap-1 text-ter">
                  <button data-copy-msg="${m.id}" type="button" class="copy-msg p-1.5 rounded-lg hover:surface hover:text-pri transition" title="复制">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  </button>
                  <button data-retry-msg="${m.id}" type="button" class="retry-msg p-1.5 rounded-lg hover:surface hover:text-pri transition" title="重试">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                  </button>
                  ${branchCount > 1 ? `
                    <div class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-lg surface text-[11px] font-mono text-sec">
                      <button data-prev-br="${m.id}" type="button" class="prev-br p-0.5 hover:text-pri"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>
                      <span>${m.activeBranch + 1}/${branchCount}</span>
                      <button data-next-br="${m.id}" type="button" class="next-br p-0.5 hover:text-pri"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>
                    </div>` : ''}
                </div>

                ${hasSources ? `
                  <button data-open-sources="${m.id}" type="button" class="open-sources h-6 px-2.5 rounded-full surface border b-line text-[11px] font-medium text-sec hover:text-pri inline-flex items-center gap-1.5 transition">
                    <i data-lucide="globe" class="w-3 h-3" style="color: var(--brand);"></i>
                    <span>来源 · ${br.sources.length}</span>
                  </button>` : ''}
              </div>` : ''}
          </div>`;
      }).join('');

      container.querySelectorAll('.toggle-think').forEach((btn) => {
        btn.addEventListener('click', () => {
          const msg = session.messages.find((x) => x.id === btn.dataset.toggleThink);
          if (msg) { msg.branches[msg.activeBranch].thinkingOpen = !msg.branches[msg.activeBranch].thinkingOpen; renderAll(); }
        });
      });
      container.querySelectorAll('.copy-msg').forEach((btn) => {
        btn.addEventListener('click', () => {
          const msg = session.messages.find((x) => x.id === btn.dataset.copyMsg);
          if (msg) copyToClipboard(msg.branches[msg.activeBranch].text, '已复制');
        });
      });
      container.querySelectorAll('.retry-msg').forEach((btn) => btn.addEventListener('click', () => retryMessage(btn.dataset.retryMsg)));
      container.querySelectorAll('.prev-br').forEach((btn) => {
        btn.addEventListener('click', () => {
          const msg = session.messages.find((x) => x.id === btn.dataset.prevBr);
          if (msg && msg.activeBranch > 0) { msg.activeBranch--; renderAll(); }
        });
      });
      container.querySelectorAll('.next-br').forEach((btn) => {
        btn.addEventListener('click', () => {
          const msg = session.messages.find((x) => x.id === btn.dataset.nextBr);
          if (msg && msg.activeBranch < msg.branches.length - 1) { msg.activeBranch++; renderAll(); }
        });
      });
      container.querySelectorAll('.open-sources').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.sourcePaneMsgId = btn.dataset.openSources;
          if (state.posture === 'unfolded') { state.sourcePaneOpen = true; renderAll(); }
          else { openSheet('sources'); }
        });
      });
    }

    function retryMessage(msgId) {
      if (state.streaming) return;
      const session = getActiveSession();
      const msg = session.messages.find((x) => x.id === msgId);
      if (!msg || msg.role !== 'assistant') return;

      const model = MODEL_CATALOG.find((m) => m.id === state.modelId) || MODEL_CATALOG[0];
      const nextIdx = msg.branches.length + 1;
      const newBranch = {
        thinkingOpen: false,
        steps: state.effortIdx > 0 ? [{ kind: 'thought', text: `重新组织回答（第 ${nextIdx} 版）。` }] : [],
        sources: msg.branches[0].sources || [],
        text: '',
        streaming: true
      };
      msg.branches.push(newBranch);
      msg.activeBranch = msg.branches.length - 1;
      state.streaming = true;
      renderAll();

      const fullText = `第 **${nextIdx}** 版回答（${model.name}）：\n\n• 展开态全部复杂页面采用左列表右详情双栏，保持与主页完全一致的空间秩序。\n• 点击下方 \`< ${nextIdx}/${msg.branches.length} >\` 可随时回看上一版。`;
      let idx = 0;
      state.streamTimer = setInterval(() => {
        idx += 6;
        newBranch.text = fullText.slice(0, idx);
        if (idx >= fullText.length) {
          clearInterval(state.streamTimer);
          newBranch.text = fullText;
          newBranch.streaming = false;
          state.streaming = false;
        }
        renderMessages();
        renderChatChrome();
        lucide.createIcons();
      }, 30);
    }

    function buildSourcesListHtml(msgId) {
      const session = getActiveSession();
      let target = session.messages.find((m) => m.id === msgId);
      if (!target) {
        for (let i = session.messages.length - 1; i >= 0; i--) {
          if (session.messages[i].role === 'assistant') { target = session.messages[i]; break; }
        }
      }
      const list = target ? (target.branches[target.activeBranch].sources || []) : [];
      if (list.length === 0) return '<div class="text-xs text-ter py-8 text-center">暂无信源</div>';
      return `<div class="space-y-2.5">${list.map((src) => `
        <div class="p-3 rounded-2xl surface border b-line space-y-1.5">
          <div class="flex items-start justify-between gap-2">
            <div class="text-xs font-semibold text-pri leading-snug">${src.title}</div>
            <span class="px-1.5 py-0.5 rounded-md brand-pill text-[10px] font-mono shrink-0">${src.score}</span>
          </div>
          <div class="flex items-center gap-2 text-[10px] text-ter font-mono">
            <span>${src.site}</span><span>·</span><span>权威 ${src.auth}/4</span>
          </div>
          <div class="text-[11.5px] text-sec leading-relaxed">${src.summary}</div>
        </div>`).join('')}</div>`;
    }

    function sendMessage() {
      if (state.streaming) {
        clearInterval(state.streamTimer);
        state.streaming = false;
        const s = getActiveSession();
        const last = s.messages[s.messages.length - 1];
        if (last && last.role === 'assistant') last.branches[last.activeBranch].streaming = false;
        renderAll();
        return;
      }

      const input = $('chatInput');
      const text = input.value.trim();
      if (!text && state.pendingFiles.length === 0) return;

      const sendText = text || '请分析这份附件的核心内容。';
      const atts = state.pendingFiles.slice();
      input.value = '';
      input.style.height = 'auto';
      state.pendingFiles = [];

      const session = getActiveSession();
      if (session.messages.length === 0) { session.title = sendText.slice(0, 14); session.time = '刚刚'; }
      session.messages.push({ id: 'u_' + Date.now(), role: 'user', text: sendText, attachments: atts });

      const cleanSkill = state.skills.find((s) => s.id === 'sk_clean');
      const webOn = cleanSkill && isSkillActiveInSession(cleanSkill, session);
      const model = MODEL_CATALOG.find((m) => m.id === state.modelId) || MODEL_CATALOG[0];
      const persona = getSessionPersona(session);

      const steps = [];
      if (state.effortIdx > 0) steps.push({ kind: 'thought', text: `按「${persona.name}」设定与 ${model.name} 推理。` });
      if (webOn) steps.push({ kind: 'search', query: sendText.slice(0, 14), count: 2 });

      const sources = webOn ? [
        { title: 'HarmonyOS 阔折叠双断点适配指南', site: 'developer.huawei.com', score: '2.6', auth: 4, summary: '折叠与展开态保持状态连续，复杂配置页采用双栏分栏。' },
        { title: 'DeepSeek Search & Fetch API 文档', site: 'api-docs.deepseek.com', score: '2.5', auth: 4, summary: '按 rerank_score >= 1.5 与 authority >= 3 清洗高质量信源。' }
      ] : [];

      const branch = { thinkingOpen: false, steps, sources, text: '', streaming: true };
      session.messages.push({ id: 'a_' + Date.now(), role: 'assistant', activeBranch: 0, branches: [branch] });

      state.streaming = true;
      state.memoryRatio = Math.min(0.92, state.memoryRatio + 0.08);
      renderAll();

      const scrollEl = $('chatScroll');
      scrollEl.scrollTop = scrollEl.scrollHeight;

      const fullReply = `已按 **${persona.name}** 视角完成整理：\n\n• 针对「${sendText.slice(0, 20)}」${atts.length ? `及附件（${atts.map((a) => a.name).join('、')}）` : ''}，直接给出精简结论。\n• 点击下方**重试**可生成对比分支。`;

      let idx = 0;
      state.streamTimer = setInterval(() => {
        idx += 6;
        branch.text = fullReply.slice(0, idx);
        if (idx >= fullReply.length) {
          clearInterval(state.streamTimer);
          branch.text = fullReply;
          branch.streaming = false;
          state.streaming = false;
        }
        renderMessages();
        renderChatChrome();
        lucide.createIcons();
        scrollEl.scrollTop = scrollEl.scrollHeight;
      }, 32);
    }

    function copyToClipboard(text, toastMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(toastMsg)).catch(() => fallbackCopy(text, toastMsg));
      } else { fallbackCopy(text, toastMsg); }
    }

    function fallbackCopy(text, toastMsg) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      showToast(toastMsg);
    }

      const id = 's_' + Date.now();

      state.activeSessionId = id;
      state.memoryRatio = 0.06;
      navigateTo('chat');

      renderSessionLists();
      renderMessages();
      if (state.sourcePaneOpen) $('sourcePaneBody').innerHTML = buildSourcesListHtml(state.sourcePaneMsgId);
      renderCreatorPage();
      renderSkillsPage();
      renderSettingsPage();
      lucide.createIcons();
    }

    // 静态事件绑定
    $('btnFolded').addEventListener('click', () => { state.posture = 'folded'; renderAll(); });
    $('btnUnfolded').addEventListener('click', () => { state.posture = 'unfolded'; renderAll(); });
    $('btnTheme').addEventListener('click', () => {
      state.dark = !state.dark;
      document.documentElement.classList.toggle('dark', state.dark);
      $('themeIcon').setAttribute('data-lucide', state.dark ? 'sun' : 'moon');
      lucide.createIcons();
    });

    $('btnSimMemory').addEventListener('click', () => {
      state.memoryRatio = state.memoryRatio < 0.6 ? 0.76 : (state.memoryRatio < 0.85 ? 0.89 : 0.34);
      $('memoryBubble').classList.add('hidden');
      renderAll();
    });
    $('btnMemoryBar').addEventListener('click', () => $('memoryBubble').classList.toggle('hidden'));
    $('btnCompactNow').addEventListener('click', () => {
      state.compacting = true;
      $('memoryBubble').classList.add('hidden');
      renderAll();
      setTimeout(() => { state.compacting = false; state.memoryRatio = 0.24; renderAll(); showToast('已生成检查点摘要'); }, 800);
    });

    $('btnToggleSide').addEventListener('click', () => { state.sidebarOpen = false; renderAll(); });
    $('btnMenuTop').addEventListener('click', () => {
      if (state.posture === 'unfolded') { state.sidebarOpen = true; renderAll(); }
      else { $('mobileDrawerBackdrop').classList.remove('hidden'); }
    });
    $('btnCloseDrawer').addEventListener('click', () => $('mobileDrawerBackdrop').classList.add('hidden'));
    $('drawerDismissArea').addEventListener('click', () => $('mobileDrawerBackdrop').classList.add('hidden'));

    $('btnNewChatSide').addEventListener('click', createNewSession);
    $('btnNewChatTop').addEventListener('click', createNewSession);
    $('btnNewChatDrawer').addEventListener('click', createNewSession);
    $('btnCloseSourcePane').addEventListener('click', () => { state.sourcePaneOpen = false; renderAll(); });

    // 页面级路由跳转（全部独立全页，不再弹底部框）
    document.querySelectorAll('.route-btn').forEach((b) => {
      b.addEventListener('click', () => navigateTo(b.dataset.route, 'master'));
    });
    document.querySelectorAll('[data-drawer-route]').forEach((b) => {
      b.addEventListener('click', () => navigateTo(b.dataset.drawerRoute, 'master'));
    });
    document.querySelectorAll('.back-chat-btn').forEach((b) => {
      b.addEventListener('click', () => navigateTo('chat'));
    });

    // 折叠态从详情页退回列表页
    $('btnCreatorBackList').addEventListener('click', () => { state.foldedSubView = 'master'; renderAll(); });
    $('btnSkillsBackList').addEventListener('click', () => { state.foldedSubView = 'master'; renderAll(); });
    $('btnSettingsBackList').addEventListener('click', () => { state.foldedSubView = 'master'; renderAll(); });

    // 创造室事件
    $('creatorSearch').addEventListener('input', (e) => { state.creatorSearch = e.target.value; renderCreatorPage(); lucide.createIcons(); });
    $('btnNewSkillMd').addEventListener('click', () => {
      const id = 'sk_' + Date.now();
      state.skills.unshift({
        id, name: '未命名技能', tier: '声明式', globalEnabled: true, minScore: 1.5, minAuth: 3, excludeDomains: '',
        md: `---\nname: 未命名技能\ntier: L1_DECLARATIVE\n---\n\n# 技能规则\n\n在此编写指令。`
      });
      state.creatorActiveSkillId = id;
      state.foldedSubView = 'detail';
      renderAll();
    });
    $('btnMdEdit').addEventListener('click', () => { state.creatorMode = 'edit'; renderCreatorPage(); });
    $('btnMdPreview').addEventListener('click', () => { state.creatorMode = 'preview'; renderCreatorPage(); });
    $('skillMdEditor').addEventListener('input', (e) => {
      const sk = state.skills.find((s) => s.id === state.creatorActiveSkillId);
      if (sk) sk.md = e.target.value;
    });
    $('btnCreatorAiRewrite').addEventListener('click', () => {
      const val = $('creatorAiInput').value.trim();
      if (!val) return;
      const sk = state.skills.find((s) => s.id === state.creatorActiveSkillId);
      if (sk) { sk.md = `${sk.md.trim()}\n\n## 新增规则\n- ${val}\n`; $('creatorAiInput').value = ''; renderCreatorPage(); showToast('已更新 SKILL.md'); }
    });
    $('btnCreatorDryRun').addEventListener('click', () => {
      $('creatorDryRunText').textContent = '试跑通过 · 138ms';
      $('creatorDryRunBanner').classList.remove('hidden');
    });
    $('btnCloseDryRun').addEventListener('click', () => $('creatorDryRunBanner').classList.add('hidden'));
    $('btnCreatorSave').addEventListener('click', () => {
      const sk = state.skills.find((s) => s.id === state.creatorActiveSkillId);
      if (sk) { const m = sk.md.match(/^name:\s*(.+)$/m); if (m) sk.name = m[1].trim(); }
      renderAll();
      showToast('已保存落盘');
    });

    // 技能页快捷按钮
    $('btnSkillImport').addEventListener('click', () => showToast('支持粘贴 JSON 或 Git 链接导入'));
    $('btnSkillOpenCreator').addEventListener('click', () => {
      state.creatorActiveSkillId = state.skillsActiveId;
      navigateTo('creator', 'detail');
    });

    // 轻量半模态快切
    $('btnModelCapsule').addEventListener('click', () => openSheet('model'));
    $('btnSessionPersona').addEventListener('click', () => openSheet('sessionPersona'));
    $('btnAttach').addEventListener('click', () => openSheet('attach'));
    $('btnFoldSkillQuick').addEventListener('click', () => openSheet('sessionSkills'));
    $('btnCloseSheet').addEventListener('click', closeSheet);
    $('sheetDismissArea').addEventListener('click', closeSheet);

    $('sideSearch').addEventListener('input', (e) => { state.searchQuery = e.target.value; renderSessionLists(); });
    $('btnSend').addEventListener('click', sendMessage);
    $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    $('chatInput').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 96) + 'px'; });

    $('btnExportSpec').addEventListener('click', () => { $('specCode').textContent = ARKUI_SPEC_TEXT; $('specModal').classList.remove('hidden'); lucide.createIcons(); });
    $('btnCloseSpec').addEventListener('click', () => $('specModal').classList.add('hidden'));
    $('btnCopySpec').addEventListener('click', () => copyToClipboard(ARKUI_SPEC_TEXT, '已复制 Pura X Max v3 定稿指令'));

    renderAll();
  </script>
</body>
</html>
